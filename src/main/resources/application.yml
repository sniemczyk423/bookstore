spring:
  application:
    name: bookstore

  datasource:
    url: jdbc:postgresql://localhost:5433/bookstore_db
    username: bookstore_user
    password: bookstore_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080